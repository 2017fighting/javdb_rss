# javdb-rss 配置示例
#
#   javdb-rss -config config.yaml
#
# 改完配置后发 SIGHUP 即可生效（配置文件写坏了会保留旧配置继续服务）：
#   kill -HUP $(pidof javdb-rss)
#
# ⚠️ 配置结构还有两份手抄本：deploy/config.docker.yaml 与 deploy/k8s.yaml 内嵌的
#    ConfigMap。三份的**键集合**由 internal/config/examples_sync_test.go 强制一致
#    （取值可以不同）。加/删/改配置项时三处都要动，否则 `make test` 会失败。

# HTTP 监听地址。
#
# 默认是 127.0.0.1 —— 本服务不做鉴权，因此默认不对局域网可见。
# 要让别的机器上的 qBittorrent 订到，改成 ":8080" 或 "0.0.0.0:8080"，
# 并自己确保它不会被暴露到公网：任何拿到 URL 的人都能看到你的订阅内容。
listen: "127.0.0.1:8080"

# 数据源实现。
#
#   appapi —— 真实的 JavDB App 私有 API。
#   stub   —— 固定样例数据，不访问网络，用于跑通链路或离线调试。
provider: "appapi"

feed:
  title: "JavDB RSS"
  description: "由 JavDB 官方 App 私有 API 生成的订阅源"
  language: "zh-CN"
  # 本服务的对外地址，用于 feed 的 <link>。路由中的 host 不可靠，所以在这里显式配置。
  base_url: "http://127.0.0.1:8080"

app_api:
  host: "https://jdforrepam.com"
  # token 文件路径（由 `javdb-rss login` 写入，权限 0600）。
  #
  # 留空或文件不存在 = 匿名访问，这对「番号追新」和「女优追新」完全够用。
  # 只有需要读取你在 App 里收藏的女优时才需要它。
  # 支持裸 JWT，或 {"token": "..."} 形式的 JSON。
  #
  # ⚠️ 环境变量 JAVDB_TOKEN **优先于**这个文件。正式部署用它更合适
  #    （容器里不方便挂可写文件），本地开发用 `javdb-rss login`。
  token_file: ""
  lang: "zh-CN"

  # 并行拉取磁链的并发上限。
  #
  # 实测：串行拉一个 50 部的女优页要 6.75s，而上游本身只需 ~218ms ——
  # 瓶颈在我们自己。并发 8 降到 1.30s（16 只再快 0.44s，收益已递减）。
  # 调成 1 可完全串行；调高会更快，但我们是第三方上游的客人。
  magnet_concurrency: 8

  # -- 以下两个环境变量启用「自动续期」。⚠️ 建议**不要开** --
  #
  # 实测解出的 token 里**没有 exp** —— 它不会自己过期，只在「别处登录」时
  # 被挤掉。而那个「别处」通常就是你自己的手机。
  #
  # 于是开了自动续期会变成拉锯战：
  #     你打开 App        -> 服务的 token 失效
  #     服务自动重登       -> 把你手机踢下线
  #     你再次打开 App    -> 服务的 token 又失效
  #     …无限循环
  #
  # 推荐：不设这两个。token 不过期，一次登录就够用；真被挤掉了重跑
  #      `javdb-rss login` 即可。
  # 只有当你打算手机上不再登录这个账号时，自动续期才有意义。
  #
  #    JAVDB_USERNAME=...
  #    JAVDB_PASSWORD=...
  # 固定设备标识，让一台实例长期保持同一身份。留空则用内置默认值。
  device_uuid: ""
  # 上游健康检查间隔，如 "15m" / "1h"。
  #
  # 它检查的是本服务**唯一已知会失效的输入** —— 签名常量是否还跟服务端兼容。
  # 与 provider 是否已实现无关，因此现在就可以打开。
  #
  # 打开后：
  #   /readyz           上游坏了返回 503（供 k8s readinessProbe）
  #   /healthz/upstream 机读详情，含 signature_broken 字段（供 CronJob / 告警）
  #
  # k8s 里典型用法：
  #   livenessProbe:  httpGet: {path: /healthz, port: 8080}
  #   readinessProbe: httpGet: {path: /readyz,  port: 8080}
  #
  # 注意 liveness **必须**打 /healthz 而不是 /readyz ——
  # 签名失效重启一千次也没用，把上游状态掺进 liveness 会造成重启循环。
  #
  # 设为 0 关闭探针。
  probe_interval: "15m"

# 可选白名单。
#
# 不写这一段：URL 本身就是订阅声明，任何 /rss/code/{番号}.xml 都会被服务。
# 写了这一段：只有列出的订阅会被服务，其余返回 404。
#
# 需要「预热已知订阅」「避免被上级误以为服务了未知内容」时再打开。
#
# feeds:
#   codes:
#     - KV-328
#     - ABC-123
#   actresses:
#     - id: EvkJ
#       # 原样透传给 App 女优页的查询参数，本服务不解释这些键值。
#       # 可用键见 .scratch/javdb-rss/issues/06-api-contract-survey.md：
#       #   filter_by       实体掩码：{zone}:{letter}:{id}[:{main}:]:
#       #                   不写时本服务会自动构造为 0:a:<女优 id>
#       #   filter_by_tags  标签 id 的 CSV
#       #   sort_by         release（默认）
#       #   order_by        desc / asc（默认 desc）
#       #   pages           翻多少页，默认 1，上限 20
#       #
#       # ⚠️ filter_by 不是简单的字母组合。它是复合掩码：
#       #      {zone}:{letter}:{id}[:主属性逗号列表::]
#       #
#       #    写成 "a" 或 "apmc" 会被原样透传，服务端返回【全站最新作品】
#       #    而不是这个女优的作品 —— 而且不报错。
#       #    主属性"拼在一起"也一样被静默忽略（见下）。
#       #
#       #    可用主属性字母：p=可播放 m=可下载 c=中文字幕 s=单体作品 i v
#       #    多个必须用**逗号**分隔：
#       #        0:a:EvkJ            全部作品（推荐留空，本服务自动构造这个）
#       #        0:a:EvkJ:c::        只看带中文字幕的
#       #        0:a:EvkJ:c,m::      ✅ 逗号分隔
#       #        0:a:EvkJ:cm::       ❌ 拼在一起会被服务端静默忽略（等于没筛选）
#       #
#       #    本服务会拦下拼接写法并返回 400，因为静默忽略比报错危险得多。
#       params:
#         sort_by: "release"
#         order_by: "desc"
#       # 只追新：只保留此日期之后的作品。
#       # 语义尚未定稿 —— 目前按 release_date 比较，见 ticket 09。
#       since: "2026-01-01"
