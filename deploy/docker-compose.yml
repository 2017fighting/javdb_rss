# docker compose 部署示例。
#
# 用法：
#   mkdir -p data token state
#   cp deploy/config.docker.yaml data/config.yaml
#   # 编辑 data/config.yaml，特别是 base_url
#   docker compose up -d        # 第一次会从 GHCR 拉镜像（包是 public 的，不需要 docker login）
#   docker compose logs -f
#
# 改完配置后重载（不用重启容器）：
#   docker compose kill -s HUP javdb-rss

services:
  javdb-rss:
    # ⭐ 钉已发布的镜像，**全量精度 tag**（ADR 0001：不推浮动 tag —— 浮动 tag
    # 的唯一作用就是让 `docker compose pull` 静默换版本）。部署机因此不需要
    # 源码与 Go 工具链。
    #
    # 升级 = 改这一行的 tag，再 `docker compose up -d`。没有别的开关。
    # 镜像 tag 是去 v 的（1.0.0），而镜像里的 `/version` 报的是 tag 原文 v1.0.0。
    image: ghcr.io/2017fighting/javdb-rss:1.0.0

    # 想自己构建镜像的人改用下面这段（删掉上面的 image:），再 `docker compose build`。
    # 那需要源码与 Go 工具链，也正是本文件默认不再做的事。
    #
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    #   args:
    #     VERSION: "dev"

    container_name: javdb-rss
    restart: unless-stopped

    ports:
      # ⚠️ 这一行决定服务是否对局域网可见。
      #
      # 绑 127.0.0.1 = 只有宿主机能访问（推荐，因为本服务不做鉴权）。
      # 要让它对别的机器可见，改成 "8080:8080" —— 但请先确认你接受
      #「任何拿到 URL 的人都能看到你的订阅内容」这件事。
      - "127.0.0.1:8080:8080"

    volumes:
      # 配置：只读挂载。容器内不需要写它。
      - ./data/config.yaml:/config/config.yaml:ro
      # token：只读挂载。目录可不存在 —— 需求 1/2/3 不需要 token，
      # 文件缺失时服务按匿名访问启动。
      - ./token:/token:ro
      # ⭐ pin 状态：**可写且持久**。这是本服务唯一的持久状态。
      #
      # 丢掉它会发生什么：服务按规则重新选磁链 → 约 1/4 的作品 guid 变化
      # → qBittorrent 各自再下一份，且没有任何告警（见 ticket 08）。
      #
      # 因此它是宿主机的**普通目录**（./state），不是匿名卷 ——
      # 删掉容器、重建、升级都不会丢；它也便于你直接查看/备份那个
      # pin.json（它就是一个可读的 JSON 文件）。
      #
      # 准备：mkdir -p state
      - ./state:/state

    # 让容器内的进程能收到 docker kill -s HUP（配置重载）。
    # 用 exec 形式的 ENTRYPOINT 时不需要 init，但保留 init 更稳妥，
    # 能顺带回收僵尸进程。
    init: true

    # 资源限制：本服务很轻（单个 Go 二进制），上限给宽一点即可。
    # 主要防止「某个订阅把上游拉爆时连带把机器拖慢」。
    deploy:
      resources:
        limits:
          memory: 128M

    # healthcheck 刻意不在这里重复声明 —— 镜像的 HEALTHCHECK 已经定义了同一个探针
    # （只判断进程存活，不掺上游状态）。两处各写一份只会漂移。

    logging:
      # 结构化 stdout 已经够用；限制一下大小防止长期运行撑满磁盘。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
