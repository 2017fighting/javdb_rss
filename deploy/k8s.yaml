# kubernetes 部署示例。
#
# 这个文件把 ticket 02 做的健康检查三端点用对了 —— 那是它存在的主要理由。
#
# 应用：
#   kubectl apply -f deploy/k8s.yaml
#
# 镜像来自 GHCR（已发布，public 可匿名拉）—— 本文件不需要你本地有源码或 Docker，
# 也就不再是那个「写着 javdb-rss:latest 但其实无处可拉」的文件了。
#
# 配置直接写在本文件内嵌的 ConfigMap 里（没有单独的配置文件）。
# 改配置：编辑下面 ConfigMap 的 config.yaml，然后 kubectl apply 一次。
# 本服务支持 SIGHUP 热重载，但改 ConfigMap 不会重载 Pod —— 需要 rollout restart
# 或用 kubectl exec 发 SIGHUP。
#
# ⚠️ 读之前先理解一件事：本服务**不做鉴权**。
# Service 的类型决定了谁能访问它 —— 本示例用 ClusterIP（只有集群内可达）。
# 不要为了图方便改成 LoadBalancer 或 NodePort 后忘记它没有身份验证。

apiVersion: v1
kind: ConfigMap
metadata:
  name: javdb-rss-config
data:
  # 注意 listen 必须是 0.0.0.0（默认的 127.0.0.1 在 Pod 外访问不到）。
  # base_url 要填你实际访问它的地址。
  #
  # ⚠️ 这段与 config.example.yaml、deploy/config.docker.yaml 是同一套配置结构的
  #    三份手抄本，键集合由 internal/config/examples_sync_test.go 强制一致。
  config.yaml: |
    listen: "0.0.0.0:8080"
    provider: "appapi"
    feed:
      title: "JavDB RSS"
      description: "由 JavDB 官方 App 私有 API 生成的订阅源"
      language: "zh-CN"
      base_url: "http://javdb-rss.default.svc.cluster.local:8080"
    app_api:
      host: "https://jdforrepam.com"
      token_file: "/token/token.json"
      # pin 状态文件：本服务**唯一**的持久状态（见 ticket 08）。
      # 🔴 必须挂一个**可写且持久**的卷（下面是 state 这个 PVC）——
      #    丢掉它会让约 1/4 的作品换磁链、guid 变化、qBittorrent 重复下载。
      #    不要用 emptyDir：Pod 重建（节点漂移、升级）就会丢掉，
      #    而那正是最需要 pin 活下来的时刻。
      pin_file: "/state/pin.json"
      lang: "zh-CN"
      # 别漏了它 —— 上一次这份 ConfigMap 就漏了，与 config.example.yaml 漂移了。
      # 现在三份示例的键集合由 internal/config/examples_sync_test.go 强制一致，
      # 再漏就会在 `make test` / CI 里失败。
      device_uuid: ""
      magnet_concurrency: 8
      probe_interval: "15m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: javdb-rss
  labels:
    app: javdb-rss
spec:
  replicas: 1
  # 单副本现在是**强制**的，不只是礼貌：pin 文件用 flock 做单写者，
  # 而两个副本各钉一套磁链会让同一部作品产生两个 guid、qBittorrent 重复下载。
  # 第二个挂着同一个 PVC 的副本会在启动时被 flock 拒绝（可见的失败）。
  #
  # 每个副本也都会各自向上游发请求（singleflight 只在进程内合并），
  # 而本服务是第三人上游的客人 —— 单副本通常更礼貌。
  # 真要扩副本，请把 probe_interval 与 magnet_concurrency 调小，
  # 并把 pin 换成支持多写者的存储（本版本不支持）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: javdb-rss
  template:
    metadata:
      labels:
        app: javdb-rss
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: javdb-rss
          # ⭐ 钉已发布的镜像，**全量精度 tag**，与 deploy/docker-compose.yml 同一个。
          # 升级 = 改这一行的 tag，再 `kubectl apply -f deploy/k8s.yaml`。
          # 镜像 tag 是去 v 的（1.0.0），而镜像里的 `/version` 报的是 tag 原文 v1.0.0。
          image: ghcr.io/2017fighting/javdb-rss:1.0.0

          # 显式写出拉取策略，虽然对全量精度 tag 来说这本来就是默认值：
          # 全量精度 tag 的内容不会变，没必要每次启动都去 registry 问一遍。
          # 反过来说 —— 哪天允许浮动 tag 了，这一行就得重新想
          # （这正是「不推浮动 tag」的一个附带好处）。
          imagePullPolicy: IfNotPresent

          args: ["-config", "/config/config.yaml"]

          ports:
            - name: http
              containerPort: 8080

          # ⭐ 存活探针：只判断进程是否还在。
          #
          # 必须打 /healthz 而不是 /readyz。本服务唯一已知会失效的输入
          # 是签名常量（派生自 App 内的 access key，App 升级或服务端轮换
          # 都可能让它作废）—— 签名失效重启一千次也没用，
          # 把上游状态掺进 liveness 只会制造重启循环。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # ⭐ 就绪探针：上游签名坏了就摘掉 endpoint，但**不重启**。
          # 这会让 Service 不再把流量转给它，同时 Deployment 保持不动。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: token
              mountPath: /token
              readOnly: true
            # ⭐ pin 状态。**必须可写且持久** —— 丢掉它会让约 1/4 的作品
            # 换磁链、guid 变化、qBittorrent 重复下载（见 ticket 08）。
            # readOnlyRootFilesystem 保留：可写面只是这一个卷。
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: javdb-rss-config
        # token 是可选的：需求 1/2/3 不需要它。
        # 需要读 App 里收藏的女优时才要挂（见 ticket 05）。
        # 建议用 Secret 而不是直接放文件。
        - name: token
          secret:
            secretName: javdb-rss-token
            optional: true
        - name: state
          persistentVolumeClaim:
            claimName: javdb-rss-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: javdb-rss
  labels:
    app: javdb-rss
spec:
  # ClusterIP = 只有集群内可达。本服务不做鉴权，**不要**改成 LoadBalancer
  # 或 NodePort 而不先想清楚谁能访问它。
  type: ClusterIP
  selector:
    app: javdb-rss
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ⭐ 第二个 Service，**专给健康检查用**，与上面那个有一处关键差异：
# `publishNotReadyAddresses: true`。
#
# 为什么必须有它：
#
#   签名一失效，/readyz 就返回 503，K8s 会把 Pod 从**上面那个** Service 的
#   Endpoint 里摘掉 —— 那是对的（别把流量发给一个服务不了内容的实例）。
#   但告警 CronJob 原先也是通过 Service 域名访问的，于是它跟着一起被挡住：
#   连接被拒 → `set -e` 让脚本当场退出 → **根本走不到 signature_broken 判断**。
#   也就是说：最能说明「该去改代码了」的那条告警，在它唯一该响的时候是哑的。
#
# 把「给编排器的 Service」与「给人看的健康端点」分成两个 Service 就分开了这两件事。
apiVersion: v1
kind: Service
metadata:
  name: javdb-rss-health
  labels:
    app: javdb-rss
    purpose: health
spec:
  type: ClusterIP
  # 关键一行：即使 Pod 未就绪也把它放进 Endpoint。
  publishNotReadyAddresses: true
  selector:
    app: javdb-rss
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ⭐ 签名失效告警。
#
# 这是 ticket 02 那套探针设计的兑现点：
#
#   /readyz            告诉**编排器**把实例摘掉（自动、秒级）
#   /healthz/upstream  告诉**人**该去改代码了（这个 CronJob）
#
# 为什么用 CronJob 而不是 Prometheus 规则：签名失效是一种**月级**的罕见事件，
# 而它的处置方式是「去改代码」（见 THIRD_PARTY_NOTICES.md 指向上游项目），
# 不需要秒级检测。一个人读的告警比一个指标更贴合这件事。
#
# signature_broken: true 表示「要改代码，不是重试」——
# 刻意把普通网络故障排除在外，避免半夜被叫起来改一个其实只需重试的东西。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: javdb-rss-signature-check
spec:
  # 每小时看一眼。签名失效不是急事，但它会让所有 feed 静默停更，
  # 所以也不该拖到第二天才发现。
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.11.1
              env:
                - name: URL
                  # 走**健康检查专用的那个 Service**（publishNotReadyAddresses），
                  # 而不是主 Service —— 后者在 Pod 未就绪时会把我们挡在外面，
                  # 而那正是我们最需要它说话的时候。
                  # 不写死命名空间：用短名，跟 Pod 同命名空间。
                  value: "http://javdb-rss-health:8080/healthz/upstream"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  body=$(curl -sS --max-time 20 "$URL")
                  echo "upstream: $body"
                  # 用 shell 解析而不是 jq —— 少一个依赖，且这里的 JSON 很浅。
                  case "$body" in
                    *'"signature_broken":true'*)
                      echo "❌ 签名常量已失效 —— 上游拒绝了我们构造的 jdsignature。"
                      echo "   这不是网络问题，重试无用。处置步骤："
                      echo "   1. 查 javdb-cli 是否已跟进: https://github.com/FlanChanXwO/javdb-cli"
                      echo "   2. 若未跟进，见 .scratch/javdb-rss/notes/dart-toolchain-probe.md 的逆向备灾清单"
                      exit 1
                      ;;
                  esac
                  echo "✅ 签名仍然有效"
---
# ⭐ pin 状态的持久卷（ticket 08）。
#
# 为什么必须持久：pin 记住「每个作品已下发的磁链」。丢掉它，服务重启后会
# 按规则重新选 —— 而实测证明上游的磁链顺序不可用任何字段重放，重选会让
# 约 1/4 的作品换磁链、guid 变化、qBittorrent 各自再下一份，
# **而且没有任何告警**。这正是本 effort 要消除的一类失败。
#
# 为什么不是 emptyDir：
#   emptyDir 的生命周期是**Pod**。节点漂移、滚动重启、驱逐都会清空它，
#   而那恰恰是最需要 pin 活下来的时刻。用 PVC 才能跨 Pod 重建保留。
#
# 为什么是 ReadWriteOnce：
#   pin 用 flock 做单写者，本就只支持单副本。RWO 正好匹配这个语义，
#   也避免了多个 Pod 同时挂载同一份状态。
#
# 备份/迁移提示：pin.json 是一个普通 JSON 文件，直接拷走即可 ——
#   它同时钉住了「你已下发的那些磁链」，是这份部署里最该备份的小文件。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: javdb-rss-state
  labels:
    app: javdb-rss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 几千条 pin 约几百 KB。给 64Mi 是很宽松的余量，
      # 也避免某些存储类对小卷有最小尺寸门槛。
      storage: 64Mi
